[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-conversation-history"
version = "0.3.0"
description = "Rebuild, export and fork the conversation a Claude Code session transcript actually held"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DaizeDong" }]
keywords = ["claude-code", "transcript", "jsonl", "conversation", "fork"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/DaizeDong/agent-conversation-history"

[project.scripts]
agent-conversation-history = "agent_conversation_history.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
agent_conversation_history = ["web_static/*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_conversation_history", "agent_conversation_history.*"]
